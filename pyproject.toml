[project]
name = "iwork-mcp"
version = "0.2.0"
description = "MCP server driving Pages, Numbers and Keynote via AppleScript"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["mcp>=2.0"]
keywords = ["mcp", "applescript", "macos", "iwork", "pages", "numbers", "keynote"]
classifiers = [
  "Environment :: MacOS X",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iwork"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
